# OpenAPI 3.0
openapi: 3.0.3
info: { title: Product API, version: 1.0.0 }
paths:
 /products:
  get:
    operationId: products.list_products
    responses:
      '200': { description: OK }
  post:
    operationId: products.create_product
    requestBody:
      required: true
      content:
        application/json:
          schema:
            { $ref: '#/components/schemas/ProductIn' }
    responses:
      '201': { description: Created }
      '422': { description: Validation }
  /products/{id}:
    get:
      operationId: products.get_product
      parameters:
        - { name: id, in: path, required: true,
            schema: { type: integer } }
      responses:
        '200': { description: OK }
        '404': { description: Not Found }