$kind: http-request
name: PUT /books/{id} — replace
url: "{{base_url}}/books/{{book_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title": "DDIA revised", "author": "Kleppmann", "year": 2017}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("updated title", () => pm.expect(pm.response.json().title).to.eql("DDIA revised"));
    language: text/javascript
order: 4000
