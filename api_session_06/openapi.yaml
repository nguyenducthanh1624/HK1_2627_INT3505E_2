openapi: 3.1.0
info:
  title: Social Network API
  version: 1.0.0
  
servers:
  - url: https://api.example.com/v1
    

tags:
  - name: Authentication
  - name: Posts

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in and receive tokens
      
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Issue a new access token using a refresh token
      
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refresh succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token is missing, invalid, expired, revoked, or otherwise unacceptable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}:
    get:
      tags: [Posts]
      summary: Get one post
      
      security:
        - bearerAuth: []
      x-required-scopes:
        - posts:read
      parameters:
        - name: id
          in: path
          required: true
          description: Positive integer identifying the post.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Post returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Access token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Post does not exist or is not visible to this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          writeOnly: true

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true
          description: Refresh credential; do not log or expose this value.

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: Short-lived access token.
        refreshToken:
          type: string
          description: Refresh credential; protect it like a password.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Access-token lifetime in seconds.

    Post:
      type: object
      required: [id, authorId, content, visibility, createdAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        authorId:
          type: integer
          format: int64
          minimum: 1
        content:
          type: string
        visibility:
          type: string
          enum: [public, followers, private]
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [INVALID_REQUEST]
        message:
          type: string
          examples: [The request could not be processed.]
        requestId:
          type: string
          description: Optional correlation ID for support; must not contain secrets.

  responses:
    BadRequest:
      description: Request body or parameter is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Access token is valid, but the caller lacks the required scope or permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Suggested number of seconds before retrying, when available.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server error. Do not return stack traces or secrets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
